name: build-extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Build Debug EAPK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug

      - name: Package EAPK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/quranrecite_music.eapk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quranrecite_music-eapk
          path: dist/quranrecite_music.eapk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "QuranRecite Music Extension"
          body: "Direct YouTube Music & Lossless Audio Proxy for Echo."
          files: dist/quranrecite_music.eapk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
